<section id="inscription" class="registration-section">
  <div class="form-wrapper">
    <h2>Fòmilè Enskripsyon</h2>
    <p>Ranpli fòm sa a pou w rezève plas ou kounye a.</p>

    <form 
      action="https://formspree.io/f/mzdjonlb" 
      method="POST"
      enctype="multipart/form-data"
      class="registration-form"
    >

      <!-- CONFIG -->
      <input type="hidden" name="_subject" value="Nouvelle inscription IA CASHFLOW">
      <input type="hidden" name="_redirect" value="https://og202o.github.io/IA-CASFLOW/merci.html">
      <input type="text" name="_gotcha" style="display:none">

      <!-- CHAMPS -->
      <div class="field">
        <label>Siyati</label>
        <input type="text" name="signature" required>
      </div>

      <div class="field">
        <label>Nom complet</label>
        <input type="text" name="nom" required>
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="field">
        <label>WhatsApp</label>
        <input type="tel" name="whatsapp" required>
      </div>

      <div class="field">
        <label>Laj</label>
        <input type="number" name="age" required>
      </div>

      <div class="field">
        <label>Vil</label>
        <select name="ville" required>
          <option value="">Chwazi...</option>
          <option>Léogâne (29 Mas)</option>
          <option>Jacmel (26 Avril)</option>
        </select>
      </div>

      <div class="field">
        <label>Prèv Pèman</label>
        <input type="file" name="preuve" accept=".jpg,.png,.pdf" required>
      </div>

      <div class="field">
        <label>Kòmantè</label>
        <textarea name="commentaire"></textarea>
      </div>

      <button type="submit">KONFIME ENSKRIPSYON MWEN</button>

    </form>
  </div>
</section>
