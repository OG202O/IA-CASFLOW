<form
  action="https://formspree.io/f/mzdjonlb"
  method="POST"
  class="registration-form"
>

  <!-- CONFIG -->
  <input type="hidden" name="_subject" value="Nouvelle inscription IA CASHFLOW">
  <input type="hidden" name="_redirect" value="https://og202o.github.io/IA-CASFLOW/">
  <input type="text" name="_gotcha" style="display:none">

  <!-- NOM -->
  <div class="form-group">
    <label>Nom complet</label>
    <input type="text" name="nom" required>
  </div>

  <!-- WHATSAPP -->
  <div class="form-group">
    <label>Telefòn WhatsApp</label>
    <input type="tel" name="whatsapp" placeholder="8 chiffres san +509" required>
    <small>Nou pral kontakte w sou WhatsApp</small>
  </div>

  <!-- EMAIL -->
  <div class="form-group">
    <label>Email</label>
    <input type="email" name="email" required>
  </div>

  <!-- VILLE -->
  <div class="form-group">
    <label>Vil kote w prale a</label>
    <select name="ville" required>
      <option value="">Chwazi...</option>
      <option>Léogâne (29 Mas)</option>
      <option>Jacmel (26 Avril)</option>
    </select>
  </div>

  <!-- METHODE PAIEMENT -->
  <div class="form-group">
    <label>Méthode de paiement</label>
    <select name="methode_paiement" required>
      <option value="">Chwazi...</option>
      <option>MonCash</option>
      <option>NatCash</option>
      <option>Virement bancaire</option>
      <option>Autre</option>
    </select>
  </div>

  <!-- REFERENCE -->
  <div class="form-group">
    <label>Référence paiement</label>
    <input
      type="text"
      name="reference_paiement"
      placeholder="Ex: TX123456789"
      required
    >
    <small>Mete kòd tranzaksyon ou resevwa a</small>
  </div>

  <!-- WHATSAPP PROOF -->
  <div class="form-group">
    <label>Confirmation paiement</label>
    <p style="font-size:0.9rem;color:#94a3b8;">
      Apre ou fin ranpli fòm nan, voye screenshot peman an sou WhatsApp:
      <br><strong>+509 XXXX XXXX</strong>
    </p>
  </div>

  <!-- COMMENT -->
  <div class="form-group">
    <label>Avis / Kòmantè</label>
    <textarea name="commentaire" rows="4"></textarea>
  </div>

  <!-- SUBMIT -->
  <button type="submit">KONFIME ENSKRIPSYON MWEN</button>

</form>
